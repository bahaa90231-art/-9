<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اقتراح مشاريع برمجية</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Tajawal', 'Segoe UI', system-ui;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 2rem 1rem;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        .card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 30px;
            padding: 2rem;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            backdrop-filter: blur(10px);
        }

        h1 {
            color: #2d3748;
            font-size: 2.2rem;
            margin-bottom: 0.5rem;
            text-align: center;
        }

        .subtitle {
            text-align: center;
            color: #718096;
            margin-bottom: 2rem;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 1rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
            color: #2d3748;
        }

        input, textarea {
            width: 100%;
            padding: 0.8rem;
            border: 2px solid #e2e8f0;
            border-radius: 15px;
            font-size: 1rem;
            font-family: inherit;
            transition: all 0.3s;
        }

        input:focus, textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102,126,234,0.1);
        }

        textarea {
            min-height: 120px;
            resize: vertical;
        }

        button {
            width: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 1rem;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 15px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }

        button:active {
            transform: translateY(0);
        }

        .message {
            margin-top: 1.5rem;
            padding: 1rem;
            border-radius: 15px;
            text-align: center;
            display: none;
        }

        .success {
            background: #c6f6d5;
            color: #22543d;
            border: 1px solid #9ae6b4;
            display: block;
        }

        .error {
            background: #fed7d7;
            color: #742a2a;
            border: 1px solid #fc8181;
            display: block;
        }

        .loading {
            display: none;
            text-align: center;
            margin-top: 1rem;
            color: #4a5568;
        }

        .footer {
            text-align: center;
            margin-top: 2rem;
            color: rgba(255,255,255,0.9);
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <h1>💡 اقتراح مشروع برمجي</h1>
            <div class="subtitle">شاركنا أفكارك لتطوير مشاريع تقنية مفيدة مع المبرمج  بهاء الحسين</div>

            <form id="suggestionForm">
                <div class="form-group">
                    <label>👤 الاسم (كامل)</label>
                    <input type="text" id="name" required placeholder="مثال: أحمد محمد">
                </div>

                <div class="form-group">
                    <label>📧 البريد الإلكتروني</label>
                    <input type="email" id="email" required placeholder="ahmed@example.com">
                </div>

                <div class="form-group">
                    <label>🚀 عنوان المشروع</label>
                    <input type="text" id="projectTitle" required placeholder="مثال: منصة تعليم تفاعلية بالذكاء الاصطناعي">
                </div>

                <div class="form-group">
                    <label>📝 وصف الفكرة (ماذا يفعل المشروع؟ من هم المستخدمون؟)</label>
                    <textarea id="description" required placeholder="اكتب شرحاً موجزاً للفكرة ..."></textarea>
                </div>

                <button type="submit">✨ إرسال الاقتراح</button>
            </form>

            <div id="message" class="message"></div>
            <div id="loading" class="loading">جاري الإرسال إلى قاعدة البيانات ... ⏳</div>
        </div>
        <div class="footer">
         المبرمج و المطور بهاء الحسين✨
        </div>
    </div>

    <script>
        const FORM_URL = "https://script.google.com/macros/s/AKfycbzWkC6C-mc2ThvM-Q15IxmtxypQNut8aFCIffZrbSbEXdXqHNYRulUr7QCvo-WLAFA-/exec"; // استبدل هذا بالرابط من Google Apps Script

        const form = document.getElementById('suggestionForm');
        const messageDiv = document.getElementById('message');
        const loadingDiv = document.getElementById('loading');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            // جمع البيانات
            const formData = {
                name: document.getElementById('name').value.trim(),
                email: document.getElementById('email').value.trim(),
                projectTitle: document.getElementById('projectTitle').value.trim(),
                description: document.getElementById('description').value.trim()
            };

            // تحقق من الحقول
            if (!formData.name || !formData.email || !formData.projectTitle || !formData.description) {
                showMessage('يرجى ملء جميع الحقول', 'error');
                return;
            }

            // إظهار التحميل
            loadingDiv.style.display = 'block';
            messageDiv.style.display = 'none';

            try {
                const response = await fetch(FORM_URL, {
                    method: 'POST',
                    mode: 'no-cors', // لتجنب مشاكل CORS
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(formData)
                });

                // نظراً لأن mode: 'no-cors' لا نستطيع قراءة الرد، نفترض النجاح
                showMessage('✅ تم إرسال اقتراحك بنجاح! شكراً لمشاركتنا الفكرة.', 'success');
                form.reset();
                
            } catch (error) {
                console.error('Error:', error);
                showMessage('❌ حدث خطأ، يرجى المحاولة مرة أخرى أو التواصل مع الدعم.', 'error');
            } finally {
                loadingDiv.style.display = 'none';
            }
        });

        function showMessage(msg, type) {
            messageDiv.textContent = msg;
            messageDiv.className = `message ${type}`;
            messageDiv.style.display = 'block';
            
            // إخفاء الرسالة بعد 5 ثوانٍ
            setTimeout(() => {
                messageDiv.style.display = 'none';
            }, 5000);
        }
    </script>
</body>
</html>
